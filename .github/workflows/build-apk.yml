name: Build AVANI360 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Frontend Dependencies & Build Web Assets
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor packages
        working-directory: frontend
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Add Capacitor Android Platform
        working-directory: frontend
        run: npx cap add android

      - name: Generate Android icons from brand logo
        working-directory: frontend
        run: |
          pip install Pillow
          python3 << 'EOF'
          from PIL import Image
          import os

          sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192,
          }

          src = Image.open('public/icon.png').convert('RGBA')
          base = 'android/app/src/main/res'
          os.makedirs(base, exist_ok=True)

          for folder, size in sizes.items():
            path = os.path.join(base, folder)
            os.makedirs(path, exist_ok=True)
            img = src.resize((size, size), Image.LANCZOS)
            img.save(os.path.join(path, 'ic_launcher.png'))
            img.save(os.path.join(path, 'ic_launcher_round.png'))
            print('Generated', folder, size)

          splash_src = Image.open('public/splash.png').convert('RGB')
          splash_sizes = {
            'drawable-land-mdpi': (480,320),
            'drawable-land-hdpi': (800,480),
            'drawable-land-xhdpi': (1280,720),
            'drawable-land-xxhdpi': (1600,960),
            'drawable-port-mdpi': (320,480),
            'drawable-port-hdpi': (480,800),
            'drawable-port-xhdpi': (720,1280),
            'drawable-port-xxhdpi': (960,1600),
          }
          for folder, size in splash_sizes.items():
            path = os.path.join(base, folder)
            os.makedirs(path, exist_ok=True)
            img = splash_src.resize(size, Image.LANCZOS)
            img.save(os.path.join(path, 'splash.png'))
            print('Generated splash', folder)
          print('All icons done')
          EOF

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: |
          npx cap sync android
          ls -la android/gradlew || (echo "ERROR: gradlew not found!" && exit 1)

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ls -la gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -150

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/AVANI360-v1.0.apk

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVANI360-Android-APK
          path: output/AVANI360-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: AVANI360 Android v1.1.0
          body: |
            ## 📱 AVANI360 Android App v1.1.0

            Tamil Nadu Real Estate & Land Marketplace by Greenyas Consultancy Services.

            ### ✨ What's new in v1.1.0:
            - ✅ Official AVANI360 Brand Logo & App Icon
            - ✅ New splash screen with brand emblem
            - ✅ Beige Navbar with real logo
            - ✅ OTP Forgot-Password via Brevo (100% free, inbox delivery)
            - ✅ 99acres-inspired Modern UI
            - ✅ Mobile Bottom Navigation bar

            ### 📥 Installation:
            Download `AVANI360-v1.0.apk` and install on any Android phone (Android 7.0+).
          files: output/AVANI360-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
