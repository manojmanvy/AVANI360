name: Build BookMyLand Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies & Build Web Assets
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android Platform & Sync
        working-directory: frontend
        run: |
          npm install --save-dev @capacitor/core@5.7.8 @capacitor/cli@5.7.8 @capacitor/android@5.7.8 --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/BookMyLand-v1.0.apk

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookMyLand-Android-APK
          path: output/BookMyLand-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: BookMyLand Android v1.0.0
          body: |
            ## 📱 BookMyLand Android App Preview
            
            Tamil Nadu Real Estate & Land Marketplace.
            
            ### ✨ Included in this build:
            - 99acres-inspired Modern UI
            - Muted Sage Grey + Warm Cream Beige + Signature Green palette
            - Mobile Bottom Navigation bar with center "+Sell Land FREE" button
            - Slide-up bottom sheets for Seller Listing & Enquiry forms
            - Pre-loaded Tamil Nadu demo properties (Chennai, Coimbatore, Madurai, Trichy, Salem)
            - Direct Call & WhatsApp buyer enquiry system
            
            ### 📥 Installation:
            Download `BookMyLand-v1.0.apk` below and install on any Android phone (Android 7.0+).
          files: output/BookMyLand-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
